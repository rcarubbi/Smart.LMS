name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SmartLMS.slnx
      - run: dotnet build SmartLMS.slnx --no-restore
      - run: dotnet test --solution SmartLMS.slnx --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/smartlms-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/smartlms-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
